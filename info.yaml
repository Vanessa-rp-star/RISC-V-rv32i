yaml_version: 6
project:
  title: "RISC-V 32-bit Single-Cycle"
  author: "Vanessa Rocha Perez"
  description: "Procesador RV32I de ciclo unico"
  language: "Verilog"
  clock_hz: 10000000
 
  tiles: "4x2"
 
  source_files:
    - "tt_um_vanessa_riscv.v"
  top_module: "tt_um_vanessa_riscv"
 
pinout:
  ui[0]: "GPIO-in (leible en 0x50 por software)"
  ui[1]: "GPIO-in (leible en 0x50 por software)"
  ui[2]: "GPIO-in (leible en 0x50 por software)"
  ui[3]: "UART RX"
  ui[4]: "GPIO-in (leible en 0x50 por software)"
  ui[5]: "GPIO-in (leible en 0x50 por software)"
  ui[6]: "GPIO-in (leible en 0x50 por software)"
  ui[7]: "GPIO-in (leible en 0x50 por software)"
 
  uo[0]: "PC[0] (debug)"
  uo[1]: "PC[1] (debug)"
  uo[2]: "PC[2] (debug)"
  uo[3]: "UART TX pin (estado de la linea)"
  uo[4]: "tx_busy (status)"
  uo[5]: "loading_any (status: 1=recibiendo programa, sea por UART o por SPI)"
  uo[6]: "mode[0] (00=LOAD, 01=RUN, 10=BLOCKLOAD)"
  uo[7]: "mode[1]"
 
  uio[0]: "SPI CS_n (salida)"
  uio[1]: "SPI MOSI (salida)"
  uio[2]: "SPI MISO (entrada)"
  uio[3]: "SPI SCK (salida)"
  uio[4]: "No usado"
  uio[5]: "No usado"
  uio[6]: "No usado"
  uio[7]: "No usado"
 
